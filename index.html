<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PokéList - Génération 1</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="theme-color" content="#3b6ce0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PokéList" />
</head>
<body>
  <header class="app-header">
    <h1>PokéList <span class="subtitle">Génération 1</span> <span id="app-version" class="app-version"></span></h1>
    <button id="settings-btn" class="settings-btn" aria-label="Réglages" title="Réglages">⚙️</button>
    <nav class="mode-nav">
      <button class="mode-btn active" data-mode="home">🏠 Accueil</button>
      <button class="mode-btn" data-mode="list">📋 Liste</button>
      <button class="mode-btn" data-mode="quiz">❓ Quiz</button>
    </nav>
  </header>

  <main>
    <section id="view-home" class="view">
      <div class="home-grid">
        <button class="home-card" data-mode="list">
          <span class="home-card-icon">📋</span>
          <span class="home-card-title">Mode Liste</span>
          <span class="home-card-desc">Coche les 151 Pokémon que tu as attrapés.</span>
          <span class="home-card-stat" id="home-list-stat">0 / 151 attrapés</span>
        </button>
        <button class="home-card" data-mode="quiz">
          <span class="home-card-icon">❓</span>
          <span class="home-card-title">Mode Quiz</span>
          <span class="home-card-desc">Devine le nom de chaque Pokémon caché.</span>
          <span class="home-card-stat" id="home-quiz-stat">0 / 151 trouvés</span>
        </button>
      </div>
    </section>

    <section id="view-list" class="view" hidden>
      <div class="progress">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-text">0 / 151 attrapés</span>
      </div>

      <div class="toolbar">
        <input type="text" id="search" class="text-input" placeholder="Rechercher un Pokémon (nom ou numéro)..." />
        <div class="toolbar-buttons">
          <button id="check-all">Tout cocher</button>
          <button id="uncheck-all">Tout décocher</button>
        </div>
      </div>

      <ul id="pokemon-list" class="pokemon-list"></ul>
    </section>

    <section id="view-quiz" class="view" hidden>
      <div class="progress">
        <div class="progress-bar">
          <div id="quiz-progress-fill" class="progress-fill"></div>
        </div>
        <span id="quiz-progress-text">0 / 151 trouvés</span>
      </div>

      <form id="quiz-form" class="toolbar">
        <input
          type="text"
          id="quiz-input"
          class="text-input"
          placeholder="Nom du Pokémon..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        />
        <div class="toolbar-buttons">
          <button type="submit">Valider</button>
        </div>
      </form>
      <p id="quiz-feedback" class="quiz-feedback" aria-live="polite"></p>

      <ul id="quiz-list" class="pokemon-list"></ul>
    </section>
  </main>

  <div id="settings-overlay" class="settings-overlay" hidden>
    <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-panel-header">
        <h2 id="settings-title">Réglages</h2>
        <button id="settings-close" class="settings-close" aria-label="Fermer">✕</button>
      </div>

      <div class="settings-section">
        <h3>Thème</h3>
        <div class="settings-options">
          <button class="settings-option" data-setting="theme" data-value="auto">🔄 Auto</button>
          <button class="settings-option" data-setting="theme" data-value="light">☀️ Clair</button>
          <button class="settings-option" data-setting="theme" data-value="dark">🌙 Sombre</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>Taille des cartes</h3>
        <div class="settings-options">
          <button class="settings-option" data-setting="cardSize" data-value="small">Petite</button>
          <button class="settings-option" data-setting="cardSize" data-value="medium">Moyenne</button>
          <button class="settings-option" data-setting="cardSize" data-value="large">Grande</button>
        </div>
      </div>

      <div class="settings-section">
        <h3>Sprites</h3>
        <label class="settings-toggle">
          <input type="checkbox" id="setting-animated" />
          <span class="switch"></span>
          <span>🎞️ Sprites animés</span>
        </label>
        <label class="settings-toggle">
          <input type="checkbox" id="setting-shiny" />
          <span class="switch"></span>
          <span>✨ Variante Shiny</span>
        </label>
      </div>

      <div class="settings-section">
        <h3>Réinitialiser la progression</h3>
        <div class="settings-options">
          <button id="settings-reset-list" class="settings-danger">Mode Liste</button>
          <button id="settings-reset-quiz" class="settings-danger">Mode Quiz</button>
          <button id="settings-reset-all" class="settings-danger">Tout</button>
        </div>
      </div>
    </div>
  </div>

  <script src="version.js"></script>
  <script src="pokemon-data.js"></script>
  <script src="matching.js"></script>
  <script src="settings.js"></script>
  <script src="list.js"></script>
  <script src="quiz.js"></script>
  <script src="app.js"></script>
</body>
</html>
